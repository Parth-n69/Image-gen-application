<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Pixabel</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (!saved) {
        saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand-panel">
      <div class="auth-brand-content">
        <div class="logo-lockup-stacked">
          <img src="assets/logo.png" alt="Pixabel Logo" class="logo-full-img-xl logo-shimmer-anim" />
          <div class="auth-tagline">Create. Edit. Refine.</div>
        </div>
      </div>
    </div>
    
    <div class="auth-form-panel">
      <div class="auth-card">
        
        <!-- RESET PASSWORD PANEL -->
        <div id="auth-reset-container" class="forgot-panel active">
          <h2 style="font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 8px;">Set New Password</h2>
          <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px;">Please enter your new password below.</p>
          
          <div id="reset-invalid-msg" style="display: none; flex-direction: column; gap: 16px;">
            <p style="color: var(--danger);">The password reset link is invalid or has expired.</p>
            <a href="login.html#signin" class="auth-btn-primary" style="text-decoration: none;">Request new link</a>
          </div>

          <form id="form-reset" novalidate style="display: none; flex-direction: column; gap: 20px;">
            <div class="auth-field">
              <label for="reset-pwd">New Password</label>
              <div class="auth-input-wrap">
                <input type="password" id="reset-pwd" class="auth-input" autocomplete="new-password" required />
                <button type="button" class="auth-toggle-pwd" tabindex="-1" aria-label="Toggle password visibility">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="pwd-strength">
                <div class="pwd-strength-bar" id="pwd-bar-1"></div>
                <div class="pwd-strength-bar" id="pwd-bar-2"></div>
                <div class="pwd-strength-bar" id="pwd-bar-3"></div>
              </div>
              <div class="pwd-strength-text" id="pwd-str-text">Weak</div>
              <ul class="pwd-rules">
                <li id="rule-len">At least 8 characters</li>
              </ul>
              <div class="auth-error-msg" id="reset-pwd-err"></div>
            </div>

            <div class="auth-field">
              <label for="reset-pwd-confirm">Confirm Password</label>
              <div class="auth-input-wrap">
                <input type="password" id="reset-pwd-confirm" class="auth-input" autocomplete="new-password" required />
              </div>
              <div class="auth-error-msg" id="reset-pwd-confirm-err"></div>
            </div>

            <div class="auth-error-msg auth-text-center" id="reset-global-err"></div>
            <div style="color: var(--success); font-size: 0.85rem; display: none; text-align: center;" id="reset-success-msg">Password updated successfully. Redirecting...</div>

            <button type="submit" class="auth-btn-primary" id="btn-submit-reset" disabled>
              <span class="auth-spinner" id="spinner-reset"></span>
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
