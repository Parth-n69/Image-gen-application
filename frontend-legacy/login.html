<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Pixabel</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (!saved) {
        saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand-panel">
      <div class="auth-brand-content">
        <div class="logo-lockup-stacked">
          <img src="assets/logo.png" alt="Pixabel Logo" class="logo-full-img-xl logo-shimmer-anim" />
          <div class="auth-tagline">Create. Edit. Refine.</div>
        </div>
      </div>
    </div>
    
    <div class="auth-form-panel">
      <div class="auth-card">
        
        <!-- Main Auth Container -->
        <div id="auth-main-container">
          <div class="auth-tabs">
            <button class="auth-tab active" id="tab-signin">Sign in</button>
            <button class="auth-tab" id="tab-signup">Create account</button>
          </div>

          <!-- SIGN IN FORM -->
          <form id="form-signin" class="auth-form active" novalidate>
            <div class="auth-field">
              <label for="signin-email">Email</label>
              <div class="auth-input-wrap">
                <input type="email" id="signin-email" class="auth-input" autocomplete="email" required />
              </div>
              <div class="auth-error-msg" id="signin-email-err" role="alert" aria-live="polite"></div>
            </div>
            
            <div class="auth-field">
              <label for="signin-pwd">Password</label>
              <div class="auth-input-wrap">
                <input type="password" id="signin-pwd" class="auth-input" autocomplete="current-password" required />
                <button type="button" class="auth-toggle-pwd" tabindex="-1" aria-label="Toggle password visibility">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="auth-error-msg" id="signin-pwd-err" role="alert" aria-live="polite"></div>
            </div>

            <div class="auth-links">
              <div></div>
              <button type="button" class="auth-link" id="btn-forgot-pwd">Forgot password?</button>
            </div>

            <div class="auth-error-msg auth-text-center auth-mt-4" id="signin-global-err" role="alert" aria-live="assertive"></div>

            <button type="submit" class="auth-btn-primary" id="btn-submit-signin">
              <span class="auth-spinner" id="spinner-signin"></span>
              Sign in
            </button>
            
            <div id="guest-mode-container" class="auth-text-center auth-mt-4" style="display: none;">
              <button type="button" class="auth-link" id="btn-guest">Continue as guest</button>
              <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Log in to save your images.</p>
            </div>
          </form>

          <!-- SIGN UP FORM -->
          <form id="form-signup" class="auth-form" novalidate>
            <div class="auth-field">
              <label for="signup-name">Full name</label>
              <div class="auth-input-wrap">
                <input type="text" id="signup-name" class="auth-input" autocomplete="name" required />
              </div>
              <div class="auth-error-msg" id="signup-name-err" role="alert" aria-live="polite"></div>
            </div>

            <div class="auth-field">
              <label for="signup-username">Username</label>
              <div class="auth-input-wrap">
                <input type="text" id="signup-username" class="auth-input" autocomplete="username" pattern="[a-z0-9_]{3,20}" title="3-20 characters, lowercase letters, numbers, underscore only" required />
              </div>
              <div class="auth-error-msg" id="signup-username-err" role="alert" aria-live="polite"></div>
            </div>

            <div class="auth-field">
              <label for="signup-email">Email</label>
              <div class="auth-input-wrap">
                <input type="email" id="signup-email" class="auth-input" autocomplete="email" required />
              </div>
              <div class="auth-error-msg" id="signup-email-err" role="alert" aria-live="polite"></div>
            </div>

            <div class="auth-field">
              <label for="signup-pwd">Password</label>
              <div class="auth-input-wrap">
                <input type="password" id="signup-pwd" class="auth-input" autocomplete="new-password" required />
                <button type="button" class="auth-toggle-pwd" tabindex="-1" aria-label="Toggle password visibility">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="pwd-strength">
                <div class="pwd-strength-bar" id="pwd-bar-1"></div>
                <div class="pwd-strength-bar" id="pwd-bar-2"></div>
                <div class="pwd-strength-bar" id="pwd-bar-3"></div>
              </div>
              <div class="pwd-strength-text" id="pwd-str-text">Weak</div>
              <ul class="pwd-rules">
                <li id="rule-len">At least 8 characters</li>
              </ul>
              <div class="auth-error-msg" id="signup-pwd-err" role="alert" aria-live="polite"></div>
            </div>

            <div class="auth-field">
              <label for="signup-pwd-confirm">Confirm password</label>
              <div class="auth-input-wrap">
                <input type="password" id="signup-pwd-confirm" class="auth-input" autocomplete="new-password" required />
              </div>
              <div class="auth-error-msg" id="signup-pwd-confirm-err" role="alert" aria-live="polite"></div>
            </div>

            <div class="auth-checkbox-wrap">
              <input type="checkbox" id="signup-terms" required />
              <label for="signup-terms">I agree to the <a href="terms.html" class="auth-link">Terms</a> and <a href="privacy.html" class="auth-link">Privacy Policy</a></label>
            </div>
            <div class="auth-error-msg" id="signup-terms-err" role="alert" aria-live="polite"></div>

            <div class="auth-error-msg auth-text-center" id="signup-global-err" role="alert" aria-live="assertive"></div>

            <button type="submit" class="auth-btn-primary" id="btn-submit-signup" disabled>
              <span class="auth-spinner" id="spinner-signup"></span>
              Create account
            </button>
          </form>
        </div>

        <!-- VERIFY EMAIL (OTP) SCREEN -->
        <div id="auth-verify-container" class="verify-panel auth-text-center" role="region" aria-label="Verify your email">
          <div class="verify-icon-wrap" style="margin: 12px auto 20px; color: var(--gold);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <h2 style="font-family: var(--font-serif); font-size: 1.75rem; font-weight: 600; margin-bottom: 8px; color: var(--text);">Verify your email</h2>
          <p id="verify-subtitle" style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">
            We sent a code to <strong id="verify-email-display" style="color: var(--text); font-weight: 600;"></strong>
          </p>
          <div id="verify-info-notice" class="auth-info-notice" style="display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold-soft); color: var(--gold-soft);" role="status" aria-live="polite"></div>

          <form id="form-verify-otp" novalidate style="display: flex; flex-direction: column; gap: 20px;">
            <div class="otp-inputs-wrap" id="otp-inputs-container" role="group" aria-label="Verification Code">
              <!-- Dynamically rendered OTP digit boxes based on OTP_LENGTH -->
            </div>

            <div class="auth-error-msg auth-text-center" id="otp-global-err" role="alert" aria-live="assertive"></div>
            
            <div class="auth-success-msg auth-text-center" id="otp-success-msg" role="status" aria-live="polite" style="display: none; color: var(--success); font-size: 0.95rem; font-weight: 500;">
              ✓ Email verified! Redirecting to Pixabel...
            </div>

            <button type="submit" class="auth-btn-primary" id="btn-verify-otp">
              <span class="auth-spinner" id="spinner-verify"></span>
              <span id="btn-verify-text">Verify</span>
            </button>

            <div class="otp-actions-wrap" style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
              <button type="button" class="auth-link" id="btn-resend-otp" style="font-size: 0.9rem;">
                Resend code
              </button>
              <div id="otp-resend-status" class="auth-error-msg auth-text-center" role="alert" aria-live="polite"></div>

              <button type="button" class="auth-link" id="btn-different-email" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">
                ← Use a different email
              </button>
            </div>
          </form>
        </div>

        <!-- FORGOT PASSWORD PANEL -->
        <div id="auth-forgot-container" class="forgot-panel">
          <h2 style="font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 8px;">Reset Password</h2>
          <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px;">Enter your email and we'll send you a link to reset your password.</p>
          
          <form id="form-forgot" novalidate style="display: flex; flex-direction: column; gap: 20px;">
            <div class="auth-field">
              <label for="forgot-email">Email</label>
              <div class="auth-input-wrap">
                <input type="email" id="forgot-email" class="auth-input" autocomplete="email" required />
              </div>
              <div class="auth-error-msg" id="forgot-email-err" role="alert" aria-live="polite"></div>
            </div>
            
            <div class="auth-error-msg auth-text-center" id="forgot-global-err" role="alert" aria-live="assertive"></div>
            <div style="color: var(--success); font-size: 0.85rem; display: none; text-align: center;" id="forgot-success-msg" role="status" aria-live="polite">If that email exists, we sent a link.</div>
            
            <button type="submit" class="auth-btn-primary" id="btn-submit-forgot">
              <span class="auth-spinner" id="spinner-forgot"></span>
              Send reset link
            </button>
            <button type="button" class="auth-btn-primary" style="background: transparent; border: 1px solid var(--border); color: var(--text);" id="btn-back-login">Back to login</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
