<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="pixabel-symbol">
  <!-- Outer Ring (Outlined) -->
  <rect x="20" y="0" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  <rect x="20" y="40" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  <rect x="0" y="20" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  <rect x="40" y="20" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  
  <rect x="10" y="10" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  <rect x="30" y="10" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  <rect x="10" y="30" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />
  <rect x="30" y="30" width="8" height="8" fill="none" stroke="var(--gold)" stroke-width="1.5" />

  <!-- Inner Ring (Solid) -->
  <rect x="20" y="10" width="8" height="8" fill="var(--gold)" class="pixel-solid" />
  <rect x="20" y="30" width="8" height="8" fill="var(--gold)" class="pixel-solid" />
  <rect x="10" y="20" width="8" height="8" fill="var(--gold)" class="pixel-solid" />
  <rect x="30" y="20" width="8" height="8" fill="var(--gold)" class="pixel-solid" />

  <!-- Center (Solid) -->
  <rect x="20" y="20" width="8" height="8" fill="var(--gold)" class="pixel-solid" />
</svg>
