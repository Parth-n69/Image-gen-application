<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0a0b" />
  
  <g transform="translate(8, 8)">
    <!-- Outer Ring (Outlined) -->
    <rect x="20" y="0" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <rect x="20" y="40" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <rect x="0" y="20" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <rect x="40" y="20" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    
    <rect x="10" y="10" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <rect x="30" y="10" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <rect x="10" y="30" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <rect x="30" y="30" width="8" height="8" fill="none" stroke="#d4af37" stroke-width="1.5" />

    <!-- Inner Ring (Solid) -->
    <rect x="20" y="10" width="8" height="8" fill="#d4af37" />
    <rect x="20" y="30" width="8" height="8" fill="#d4af37" />
    <rect x="10" y="20" width="8" height="8" fill="#d4af37" />
    <rect x="30" y="20" width="8" height="8" fill="#d4af37" />

    <!-- Center (Solid) -->
    <rect x="20" y="20" width="8" height="8" fill="#d4af37" />
  </g>
</svg>
