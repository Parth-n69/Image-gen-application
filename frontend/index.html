<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pixabel — AI Image Studio. Create stunning images from text prompts using multiple AI models." />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:title" content="Pixabel - AI Image Studio" />
    <meta property="og:description" content="Generate stunning AI images with a modern luxury experience." />
    <meta property="og:type" content="website" />
    <title>Pixabel - AI Image Studio</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        var saved = localStorage.getItem('theme');
        if (!saved) {
          saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
